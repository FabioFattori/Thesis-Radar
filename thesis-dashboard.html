<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thesis Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--surface:#fff;--ink:#14202b;--muted:#5b6b7a;--line:#d9e0e7;--accent:#1f5fbf;--accent-ink:#fff;--soft:#e4edfa;--good:#1b7f5c;--warn:#b45309;--bad:#a33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--surface:#17212b;--ink:#e6edf3;--muted:#8fa1b2;--line:#263543;--accent:#6aa5ff;--accent-ink:#0b1420;--soft:#1c2c42;--good:#4cc59a;--warn:#e6a04a;--bad:#f08080}}
:root[data-theme="dark"]{--bg:#0f161d;--surface:#17212b;--ink:#e6edf3;--muted:#8fa1b2;--line:#263543;--accent:#6aa5ff;--accent-ink:#0b1420;--soft:#1c2c42;--good:#4cc59a;--warn:#e6a04a;--bad:#f08080}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#drop{border:2px dashed var(--line);border-radius:14px;padding:56px 20px;text-align:center;background:var(--surface)}
#drop.over{border-color:var(--accent);background:var(--soft)}
#drop h2{margin:0 0 6px;font-size:20px}
#drop p{margin:0 0 16px;color:var(--muted)}
#app{display:none}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
aside{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=search],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 0;margin-bottom:8px;overflow:hidden}
.row.hidden-job{opacity:.5}
.bar{background:var(--line);position:relative}
.bar i{position:absolute;left:0;right:0;bottom:0;background:var(--good)}
.title{font-weight:600;font-size:16px;text-decoration:none;display:inline-block}
.title:hover{color:var(--accent);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;margin-top:2px}
.tag{background:var(--soft);color:var(--accent);border-radius:6px;padding:0 7px;font-size:12px;font-weight:600}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:0 7px}
.badge.saved{background:var(--soft);color:var(--accent)}
.badge.applied{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.score{font-weight:700;font-size:18px}
.mini{display:flex;gap:4px}
.mini button{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:30px;height:30px;cursor:pointer;line-height:1}
.mini button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:14px}
@media (max-width:820px){.layout{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Thesis Radar</h1><div class="sub">Le offerte trovate dal tuo bot, ordinate per pertinenza.</div></div>
  <div style="display:flex;gap:8px"><button class="btn" id="load2" style="display:none">Carica altro file</button><button class="btn" id="csv" style="display:none">Esporta salvate (CSV)</button></div>
</header>

<div id="drop">
  <h2>Carica jobs.jsonl</h2>
  <p>Trascina qui il file generato dal bot oppure sceglilo dal computer. Il file resta nel tuo browser.</p>
  <button class="btn primary" id="pick">Scegli file</button>
</div>
<input type="file" id="file" accept=".jsonl,.json,.txt" hidden>

<div id="app">
  <div class="stats" id="stats"></div>
  <div class="layout">
    <aside>
      <label>Cerca<input type="search" id="q" placeholder="titolo, azienda, città…"></label>
      <label>Fonte<select id="src"></select></label>
      <label>Azienda<select id="co"></select></label>
      <label>Stato<select id="st">
        <option value="active">Da valutare</option><option value="saved">Salvate</option>
        <option value="applied">Candidato</option><option value="hidden">Nascoste</option><option value="all">Tutte</option></select></label>
      <label>Punteggio minimo: <b id="minv">0</b><input type="range" id="min" min="0" max="10" value="0"></label>
      <label>Ordina per<select id="sort">
        <option value="score">Punteggio</option><option value="company">Azienda</option><option value="title">Titolo</option></select></label>
    </aside>
    <main><div class="top"><span id="count"></span></div><div id="list"></div></main>
  </div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let jobs=store.get('jobs')||[], status=store.get('status')||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';

function parse(text){
  text=text.trim(); let arr=[];
  if(text.startsWith('[')){try{arr=JSON.parse(text)}catch(e){}}
  else text.split(/\r?\n/).forEach(l=>{l=l.trim();if(l){try{arr.push(JSON.parse(l))}catch(e){}}});
  const seen=new Set();
  return arr.filter(j=>j&&j.url&&j.title&&!seen.has(j.url)&&seen.add(j.url))
    .map(j=>({source:j.source||'',company:j.company||'',title:j.title,location:j.location||'',url:j.url,score:Number(j.score)||0}));
}
function ingest(text){
  const p=parse(text);
  if(!p.length){alert('Nessuna offerta valida trovata nel file. Controlla che sia il jobs.jsonl prodotto dal bot.');return}
  jobs=p; store.set('jobs',jobs); init();
}
function readFile(f){if(f){const r=new FileReader();r.onload=()=>ingest(r.result);r.readAsText(f)}}
$('#pick').onclick=$('#load2').onclick=()=>$('#file').click();
$('#file').onchange=e=>readFile(e.target.files[0]);
const drop=$('#drop');
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));

function fill(sel,vals,all){ $(sel).innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('') }
function init(){
  $('#drop').style.display='none'; $('#app').style.display='block';
  $('#load2').style.display=$('#csv').style.display='';
  fill('#src',[...new Set(jobs.map(j=>j.source))].sort(),'Tutte le fonti');
  fill('#co',[...new Set(jobs.map(j=>j.company))].sort((a,b)=>a.localeCompare(b)),'Tutte le aziende');
  const mx=Math.max(1,...jobs.map(j=>j.score)); $('#min').max=mx;
  render();
}
function filtered(){
  const q=$('#q').value.toLowerCase(), src=$('#src').value, co=$('#co').value, st=$('#st').value, mn=+$('#min').value;
  let r=jobs.filter(j=>{
    const s=status[j.url]||'';
    if(src&&j.source!==src||co&&j.company!==co||j.score<mn) return false;
    if(q&&!(j.title+' '+j.company+' '+j.location).toLowerCase().includes(q)) return false;
    if(st==='active') return s!=='hidden';
    if(st==='all') return true;
    return s===st;
  });
  const k=$('#sort').value;
  r.sort(k==='score'?(a,b)=>b.score-a.score:(a,b)=>a[k].localeCompare(b[k]));
  return r;
}
function render(){
  const mx=Math.max(1,...jobs.map(j=>j.score)); $('#minv').textContent=$('#min').value;
  const cnt=s=>jobs.filter(j=>status[j.url]===s).length;
  $('#stats').innerHTML=[[jobs.length,'offerte'],[new Set(jobs.map(j=>j.company)).size,'aziende'],
    [new Set(jobs.map(j=>j.source)).size,'fonti'],[cnt('saved'),'salvate'],[cnt('applied'),'candidature']]
    .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  const r=filtered();
  $('#count').textContent=`${r.length} offerte mostrate`;
  $('#list').innerHTML=r.length?r.map(j=>{
    const s=status[j.url]||'', u=esc(j.url);
    return `<div class="row ${s==='hidden'?'hidden-job':''}">
      <div class="bar" title="Punteggio ${j.score}"><i style="height:${Math.round(j.score/mx*100)}%"></i></div>
      <div><a class="title" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a>
        <div class="meta"><span>${esc(j.company)}</span><span>${esc(j.location)||'Sede non indicata'}</span><span class="tag">${esc(j.source)}</span>
        ${s==='saved'?'<span class="badge saved">Salvata</span>':''}${s==='applied'?'<span class="badge applied">Candidato</span>':''}</div></div>
      <div class="actions"><span class="score" title="Punteggio di pertinenza">${j.score}</span>
        <div class="mini">
          <button data-u="${u}" data-a="saved" class="${s==='saved'?'on':''}" title="Salva" aria-label="Salva">★</button>
          <button data-u="${u}" data-a="applied" class="${s==='applied'?'on':''}" title="Segna come candidato" aria-label="Segna come candidato">✓</button>
          <button data-u="${u}" data-a="hidden" class="${s==='hidden'?'on':''}" title="Nascondi" aria-label="Nascondi">✕</button>
        </div></div></div>`}).join('')
    :'<div class="empty">Nessuna offerta con questi filtri. Abbassa il punteggio minimo o cambia stato.</div>';
}
$('#list').onclick=e=>{
  const b=e.target.closest('button[data-a]'); if(!b) return;
  const u=b.dataset.u, a=b.dataset.a;
  if(status[u]===a) delete status[u]; else status[u]=a;
  store.set('status',status); render();
};
['q','src','co','st','min','sort'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#csv').onclick=()=>{
  const rows=jobs.filter(j=>status[j.url]==='saved'||status[j.url]==='applied');
  if(!rows.length){alert('Non hai ancora salvato nessuna offerta.');return}
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv=['stato,azienda,titolo,sede,fonte,punteggio,url',...rows.map(j=>[status[j.url],j.company,j.title,j.location,j.source,j.score,j.url].map(q).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='offerte-salvate.csv';a.click();
};
if(jobs.length) init();
</script>
</body>
</html>
